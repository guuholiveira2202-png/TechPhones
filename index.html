<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechPhones </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <a href="#" class="logo" aria-label="TechPhones Home">
                <h1>tech<span>.</span></h1>
            </a>
            
            <search class="search-container">
                <form onsubmit="event.preventDefault();">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="search-input" placeholder="Buscar smartphones..." aria-label="Buscar produtos no site">
                </form>
            </search>

            <nav class="nav-actions" aria-label="Navegação do usuário">
                <button id="theme-toggle" class="icon-btn" aria-label="Alternar tema claro/escuro"></button>
                <button id="cart-toggle-btn" class="cart-btn" aria-label="Abrir sacola de compras">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                    <span id="cart-count" class="badge" aria-live="polite">0</span>
                </button>
            </nav>
        </div>
    </header>

    <section class="hero-section" aria-labelledby="hero-title">
        <div class="hero-container">
            <div class="hero-content">
                <span class="hero-tag">Enterprise Store</span>
                <h2 id="hero-title">Tecnologia sem concessões.</h2>
                <p>Ecossistema completo integrado com inteligência artificial avançada. Desempenho corporativo na palma da sua mão.</p>
                <button class="btn-primary" onclick="document.getElementById('catalog-section').scrollIntoView({behavior: 'smooth'})">Explorar Catálogo</button>
            </div>
            <div class="hero-visual">
                <img src="https://images.unsplash.com/photo-1605236453806-6ff36851218e?w=800&q=80" alt="Smartphone premium com acabamento em titânio fosco" class="hero-img-fluid">
            </div>
        </div>
    </section>

    <section class="filter-section" aria-label="Filtros de produtos" id="catalog-section">
        <div class="filter-wrapper" id="filter-pills-container">
            </div>
    </section>

    <main class="main-catalog">
        <div class="product-grid" id="product-grid" aria-live="polite">
            </div>
    </main>

    <dialog id="quick-view-modal" class="native-modal">
        <div class="modal-box">
            <button class="close-modal-btn" id="close-modal-btn" aria-label="Fechar janela de detalhes">✕</button>
            <div id="modal-render-target"></div>
        </div>
    </dialog>

    <section id="cart-sidebar" class="cart-sidebar" aria-labelledby="cart-title" aria-hidden="true">
        <div class="cart-header">
            <h2 id="cart-title">Sua Sacola</h2>
            <button id="cart-close-btn" class="close-sidebar-btn" aria-label="Fechar sacola">✕</button>
        </div>
        <div class="cart-body" id="cart-items-container"></div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span>Subtotal</span>
                <span id="cart-total-value">R$ 0,00</span>
            </div>
            <button id="checkout-submit-btn" class="btn-checkout">Proceder para o checkout</button>
        </div>
    </section>
    <div id="cart-backdrop" class="sidebar-backdrop" role="presentation"></div>

    <div id="toast-dispatcher" class="toast-container" role="alert" aria-live="assertive"></div>

    <script src="script.js"></script>


    <style>
     :root {
    color-scheme: light;
    --bg-main: #f5f5f7;
    --bg-surface: #ffffff;
    --text-main: #1d1d1f;
    --text-muted: #86868b;
    --brand-primary: #0071e3;
    --border-subtle: #d2d2d7;
    --radius-lg: 20px;
    --radius-sm: 12px;
    --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
}

[data-theme="dark"] {
    color-scheme: dark;
    --bg-main: #000000;
    --bg-surface: #1c1c1e;
    --text-main: #f5f5f7;
    --text-muted: #86868b;
    --brand-primary: #2997ff;
    --border-subtle: #38383a;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

body {
    background-color: var(--bg-main);
    color: var(--text-main);
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
}

/* Foco Acessível Profissional */
input:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--brand-primary);
    outline-offset: 3px;
}

/* Header Navbar */
.site-header {
    background-color: rgba(var(--bg-main), 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-subtle);
    position: sticky;
    top: 0;
    z-index: 500;
}
.header-container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.logo { text-decoration: none; color: inherit; }
.logo h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }
.logo span { color: var(--brand-primary); }

.search-container { flex: 1; max-width: 420px; margin: 0 20px; position: relative; }
.search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
.search-container input {
    width: 100%; padding: 10px 16px 10px 46px; border-radius: 50px;
    border: 1px solid var(--border-subtle); background-color: var(--bg-surface);
    color: var(--text-main); font-size: 0.9rem; outline: none;
    transition: border-color 0.3s var(--transition-smooth);
}
.search-container input:focus { border-color: var(--brand-primary); }

.nav-actions { display: flex; gap: 14px; align-items: center; }
.icon-btn, .cart-btn {
    background: var(--bg-surface); border: 1px solid var(--border-subtle);
    color: var(--text-main); cursor: pointer; display: flex;
    align-items: center; justify-content: center; border-radius: 50%;
    width: 42px; height: 42px; transition: transform 0.2s ease;
}
.cart-btn { border-radius: 30px; width: auto; padding: 0 16px; gap: 10px; font-weight: 600; }
.badge { background-color: var(--brand-primary); color: #fff; padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; }

/* Hero Splitted */
.hero-section { max-width: 1280px; margin: 40px auto; padding: 0 24px; }
.hero-container {
    background-color: var(--bg-surface); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg); padding: 60px; display: flex; align-items: center; gap: 40px;
}
.hero-content { flex: 1; }
.hero-tag { font-size: 0.8rem; font-weight: 700; color: var(--brand-primary); text-transform: uppercase; letter-spacing: 1px; }
.hero-content h2 { font-size: 3.2rem; font-weight: 800; tracking: -1.5px; margin: 12px 0 20px; line-height: 1.1; }
.hero-content p { color: var(--text-muted); font-size: 1.1rem; line-height: 1.6; margin-bottom: 30px; }
.btn-primary {
    background-color: var(--text-main); color: var(--bg-main); border: none;
    padding: 16px 32px; border-radius: 30px; font-weight: 600; cursor: pointer;
    transition: opacity 0.2s;
}
.btn-primary:hover { opacity: 0.9; }
.hero-visual { flex: 1; display: flex; justify-content: center; }
.hero-img-fluid { max-width: 100%; max-height: 380px; object-fit: contain; }

/* Filtros */
.filter-section { max-width: 1280px; margin: 30px auto; padding: 0 24px; }
.filter-wrapper { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.filter-pill {
    background: var(--bg-surface); border: 1px solid var(--border-subtle);
    color: var(--text-main); padding: 10px 22px; border-radius: 30px;
    font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: all 0.2s ease;
}
.filter-pill.active { background-color: var(--text-main); color: var(--bg-main); border-color: var(--text-main); }

/* Catalogo Grid */
.main-catalog { max-width: 1280px; margin: 0 auto 80px; padding: 0 24px; }
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }

.product-card {
    background: var(--bg-surface); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg); padding: 24px; display: flex; flex-direction: column;
    transition: transform 0.4s var(--transition-smooth), box-shadow 0.4s var(--transition-smooth);
}
.product-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.04); }
.card-media { height: 200px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; cursor: pointer; }
.card-media img { max-height: 100%; max-width: 100%; object-fit: contain; transition: transform 0.4s var(--transition-smooth); }
.product-card:hover .card-media img { transform: scale(1.04); }
.card-tag { font-size: 0.75rem; font-weight: 700; color: var(--brand-primary); }
.product-card h3 { font-size: 1.2rem; font-weight: 700; margin: 6px 0 10px; cursor: pointer; }
.product-card .desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; flex-grow: 1; }
.card-footer-row { display: flex; justify-content: space-between; align-items: center; }
.card-price { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; }

/* Native Dialog Element CSS */
.native-modal {
    border: none; border-radius: var(--radius-lg); background: var(--bg-surface);
    margin: auto; max-width: 760px; width: 90%; padding: 40px; box-shadow: 0 30px 60px rgba(0,0,0,0.25);
}
.native-modal::backdrop { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px); }
.close-modal-btn { position: absolute; top: 20px; right: 20px; background: var(--bg-main); border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
.modal-grid { display: flex; gap: 40px; align-items: center; }
.modal-visual { flex: 1; text-align: center; }
.modal-visual img { max-height: 320px; object-fit: contain; max-width: 100%; }
.modal-details { flex: 1; }
.modal-details h2 { font-size: 2rem; margin-bottom: 12px; }
.modal-details .price { font-size: 1.6rem; font-weight: 800; color: var(--brand-primary); margin-bottom: 20px; }

/* Sidebar da Sacola */
.cart-sidebar {
    position: fixed; top: 0; right: -420px; width: 100%; max-width: 420px; height: 100vh;
    background: var(--bg-surface); z-index: 1000; box-shadow: -10px 0 40px rgba(0,0,0,0.05);
    display: flex; flex-direction: column; transition: right 0.4s var(--transition-smooth);
}
.cart-sidebar[aria-hidden="false"] { right: 0; }
.cart-header { padding: 24px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; }
.close-sidebar-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-main); }
.cart-body { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.cart-row { display: flex; align-items: center; gap: 16px; }
.cart-row-img { width: 50px; height: 50px; object-fit: contain; }
.cart-row-meta { flex: 1; }
.cart-row-meta h4 { font-size: 0.95rem; font-weight: 700; }
.cart-row-meta p { font-size: 0.85rem; color: var(--text-muted); }
.qty-wrapper { display: flex; align-items: center; gap: 8px; background: var(--bg-main); padding: 4px 10px; border-radius: 20px; }
.qty-action-btn { background: none; border: none; font-weight: bold; cursor: pointer; color: var(--text-main); }
.cart-footer { padding: 24px; border-top: 1px solid var(--border-subtle); }
.cart-total-row { display: flex; justify-content: space-between; font-size: 1.15rem; font-weight: 800; margin-bottom: 20px; }
.btn-checkout { width: 100%; background-color: var(--text-main); color: var(--bg-main); border: none; padding: 16px; border-radius: 30px; font-weight: 700; cursor: pointer; }
.sidebar-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.2); z-index: 900; display: none; backdrop-filter: blur(4px); }
.cart-sidebar[aria-hidden="false"] + .sidebar-backdrop { display: block; }

/* Sistema de Toasts Enterprise */
.toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
.toast-card { background-color: var(--text-main); color: var(--bg-main); padding: 14px 24px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.9rem; box-shadow: 0 10px 30px rgba(0,0,0,0.1); animation: toastEntrance 0.3s var(--transition-smooth); }
@keyframes toastEntrance { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

@media (max-width: 840px) {
    .hero-container { flex-direction: column; text-align: center; padding: 40px 24px; }
    .hero-content h2 { font-size: 2.2rem; }
    .modal-grid { flex-direction: column; gap: 20px; }
}
   </style>
    <script>
 /**
 * TechPhones - Sistema Core Baseado em Gerenciamento de Estado Único (Store Pattern)
 * Evita poluição do escopo global e garante consistência dos dados do e-commerce.
 */

const Store = {
    state: {
        products: [
            { id: 1, name: "iPhone 15 Pro", category: "apple", price: 7299.00, img: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=500&q=80", tag: "iOS", desc: "Estrutura em Titânio Aeroespacial, Chip A17 Pro de última geração, armazenamento de 256GB." },
            { id: 2, name: "Galaxy S24 Ultra", category: "samsung", price: 6499.00, img: "https://images.unsplash.com/photo-1610945415295-d9bbf067e59c?w=500&q=80", tag: "Android", desc: "Galaxy AI integrada nativamente, Câmera espacial de 200MP e caneta S-Pen inteligente inclusa." },
            { id: 3, name: "Galaxy Z Flip 5", category: "samsung", price: 4299.00, img: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500&q=80", tag: "Android", desc: "Mecanismo de dobra zero-gap flexível premium, display externo customizável de alta resolução." },
            { id: 4, name: "ROG Phone 8 Pro", category: "gamer", price: 5199.00, img: "https://images.unsplash.com/photo-1556656793-08538906a9f8?w=500&q=80", tag: "Gamer", desc: "Painel AMOLED de 165Hz, refrigeração ativa avançada por câmara de vapor e gatilhos AirTrigger." }
        ],
        categories: [
            { id: "all", label: "Todos os Dispositivos" },
            { id: "apple", label: "Apple" },
            { id: "samsung", label: "Samsung" },
            { id: "gamer", label: "Linha Gamer" }
        ],
        cart: [],
        currentCategory: "all",
        searchQuery: ""
    },

    // Inicialização da aplicação
    init() {
        this.loadLocalStorage();
        this.renderPills();
        this.renderCatalog();
        this.bindEvents();
        this.syncThemeIcon();
    },

    // Salvamento seguro em LocalStorage
    saveCartToStorage() {
        localStorage.setItem("tp_enterprise_cart", JSON.stringify(this.state.cart));
    },

    loadLocalStorage() {
        const savedCart = localStorage.getItem("tp_enterprise_cart");
        if (savedCart) {
            try {
                this.state.cart = JSON.parse(savedCart);
                this.updateCartUI();
            } catch (e) {
                this.state.cart = [];
            }
        }
        
        const savedTheme = localStorage.getItem("tp_enterprise_theme") || "light";
        document.documentElement.setAttribute("data-theme", savedTheme);
    },

    // Renders de Interface Dinâmicos
    renderPills() {
        const container = document.getElementById("filter-pills-container");
        if (!container) return;
        
        container.innerHTML = this.state.categories.map(cat => `
            <button class="filter-pill ${this.state.currentCategory === cat.id ? 'active' : ''}" 
                    data-category-id="${cat.id}">
                ${cat.label}
            </button>
        `).join('');
    },

    renderCatalog() {
        const grid = document.getElementById("product-grid");
        if (!grid) return;

        const filtered = this.state.products.filter(p => {
            const matchesCategory = this.state.currentCategory === "all" || p.category === this.state.currentCategory;
            const matchesSearch = p.name.toLowerCase().includes(this.state.searchQuery.toLowerCase());
            return matchesCategory && matchesSearch;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">Nenhum smartphone atende aos critérios de busca ativos.</div>`;
            return;
        }

        grid.innerHTML = filtered.map(p => `
            <article class="product-card">
                <div class="card-media" data-action="details" data-id="${p.id}">
                    <img src="${p.img}" alt="${p.name}" loading="lazy">
                </div>
                <span class="card-tag">${p.tag}</span>
                <h3 data-action="details" data-id="${p.id}">${p.name}</h3>
                <p class="desc">${p.desc.substring(0, 65)}...</p>
                <div class="card-footer-row">
                    <span class="card-price">${p.price.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</span>
                    <button class="add-btn" data-action="add" data-id="${p.id}" aria-label="Adicionar ${p.name} à sacola">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                </div>
            </article>
        `).join('');
    },

    updateCartUI() {
        const countBadge = document.getElementById("cart-count");
        const totalValue = document.getElementById("cart-total-value");
        const container = document.getElementById("cart-items-container");

        const totalItems = this.state.cart.reduce((acc, item) => acc + item.quantity, 0);
        countBadge.textContent = totalItems;

        const totalCash = this.state.cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
        totalValue.textContent = totalCash.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        if (this.state.cart.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding-top:30px;">Sua sacola está vazia de momento.</p>`;
            return;
        }

        container.innerHTML = this.state.cart.map(item => `
            <div class="cart-row">
                <img src="${item.img}" alt="" class="cart-row-img">
                <div class="cart-row-meta">
                    <h4>${item.name}</h4>
                    <p>${item.price.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</p>
                </div>
                <div class="qty-wrapper">
                    <button class="qty-action-btn" data-qty-action="decrease" data-id="${item.id}">-</button>
                    <span aria-label="Quantidade">${item.quantity}</span>
                    <button class="qty-action-btn" data-qty-action="increase" data-id="${item.id}">+</button>
                </div>
            </div>
        `).join('');
    },

    // Mutadores de Estado Dedicados
    addToCart(id) {
        const product = this.state.products.find(p => p.id === id);
        const cartItem = this.state.cart.find(item => item.id === id);

        if (cartItem) {
            cartItem.quantity++;
        } else {
            this.state.cart.push({ ...product, quantity: 1 });
        }

        this.updateCartUI();
        this.saveCartToStorage();
        this.dispatchToast(`✓ ${product.name} alocado na sacola de compras.`);
    },

    alterQuantity(id, action) {
        const cartItem = this.state.cart.find(item => item.id === id);
        if (!cartItem) return;

        if (action === "increase") {
            cartItem.quantity++;
        } else {
            cartItem.quantity--;
            if (cartItem.quantity <= 0) {
                this.state.cart = this.state.cart.filter(item => item.id !== id);
            }
        }

        this.updateCartUI();
        this.saveCartToStorage();
    },

    // Gerenciador de Eventos Centralizado (Event Delegation Pattern)
    bindEvents() {
        // Filtros por Categoria
        document.getElementById("filter-pills-container").addEventListener("click", (e) => {
            const pill = e.target.closest(".filter-pill");
            if (!pill) return;
            this.state.currentCategory = pill.getAttribute("data-category-id");
            this.renderPills();
            this.renderCatalog();
        });

        // Ações da Grade de Catálogo (Detalhes ou Adicionar)
        document.getElementById("product-grid").addEventListener("click", (e) => {
            const target = e.target.closest("[data-action]");
            if (!target) return;

            const id = parseInt(target.getAttribute("data-id"), 10);
            const action = target.getAttribute("data-action");

            if (action === "add") this.addToCart(id);
            if (action === "details") this.openQuickView(id);
        });

        // Controle de Quantidades Internas do Carrinho
        document.getElementById("cart-items-container").addEventListener("click", (e) => {
            const button = e.target.closest("[data-qty-action]");
            if (!button) return;
            
            const id = parseInt(button.getAttribute("data-id"), 10);
            const action = button.getAttribute("data-qty-action");
            this.alterQuantity(id, action);
        });

        // Caixa de Busca com otimização simples de digitação
        document.getElementById("search-input").addEventListener("input", (e) => {
            this.state.searchQuery = e.target.value;
            this.renderCatalog();
        });

        // Gerenciamento da Interface de Carrinho Lateral
        document.getElementById("cart-toggle-btn").addEventListener("click", () => this.toggleSidebar(true));
        document.getElementById("cart-close-btn").addEventListener("click", () => this.toggleSidebar(false));
        document.getElementById("cart-backdrop").addEventListener("click", () => this.toggleSidebar(false));

        // Controle do Modal Nativo
        document.getElementById("close-modal-btn").addEventListener("click", () => document.getElementById("quick-view-modal").close());
        
        // Controle de Tema Global
        document.getElementById("theme-toggle").addEventListener("click", () => this.toggleTheme());
    },

    openQuickView(id) {
        const p = this.state.products.find(prod => prod.id === id);
        const modal = document.getElementById("quick-view-modal");
        const target = document.getElementById("modal-render-target");

        target.innerHTML = `
            <div class="modal-grid">
                <div class="modal-visual"><img src="${p.img}" alt=""></div>
                <div class="modal-details">
                    <span class="card-tag">${p.tag}</span>
                    <h2>${p.name}</h2>
                    <div class="price">${p.price.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</div>
                    <p style="margin-bottom: 24px; color: var(--text-muted); line-height:1.6;">${p.desc}</p>
                    <button class="btn-primary" style="width: 100%;" id="modal-add-action-btn">Adicionar à Sacola</button>
                </div>
            </div>
        `;

        document.getElementById("modal-add-action-btn").onclick = () => {
            this.addToCart(p.id);
            modal.close();
        };

        modal.showModal(); // API nativa de dialog do navegador
    },

    toggleSidebar(open) {
        const sidebar = document.getElementById("cart-sidebar");
        sidebar.setAttribute("aria-hidden", !open);
    },

    toggleTheme() {
        const isLight = document.documentElement.getAttribute("data-theme") === "light";
        const targetTheme = isLight ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", targetTheme);
        localStorage.setItem("tp_enterprise_theme", targetTheme);
        this.syncThemeIcon();
    },

    syncThemeIcon() {
        const isLight = document.documentElement.getAttribute("data-theme") === "light";
        const btn = document.getElementById("theme-toggle");
        
        const sunSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
        const moonSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
        
        btn.innerHTML = isLight ? moonSVG : sunSVG;
    },

    dispatchToast(message) {
        const container = document.getElementById("toast-dispatcher");
        const toast = document.createElement("div");
        toast.className = "toast-card";
        toast.textContent = message;
        
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = "0";
            toast.style.transform = "translateY(10px)";
            toast.style.transition = "all 0.3s ease";
            setTimeout(() => toast.remove(), 300);
        }, 2500);
    }
};

// Disparo seguro na carga da árvore DOM
document.addEventListener("DOMContentLoaded", () => Store.init());
    </script>
</body>
</html>
